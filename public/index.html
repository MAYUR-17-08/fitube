<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="/manifest.json"><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js");}</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fitube Music</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #000; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .header { padding: 18px 20px 10px; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
        
        .search-container { padding: 10px 20px; }
        .search-box { position: relative; width: 100%; }
        .search-box input { width: 100%; padding: 14px 16px 14px 44px; background: #161616; border: 1px solid #282828; border-radius: 28px; color: #fff; font-size: 15px; outline: none; transition: 0.2s; }
        .search-box input:focus { border-color: #3b82f6; background: #1c1c1e; }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); opacity: 0.5; font-size: 16px; }
        
        .content { flex: 1; overflow-y: auto; padding: 10px 20px 140px; }
        .song-card { display: flex; align-items: center; gap: 14px; padding: 10px; border-radius: 14px; margin-bottom: 8px; background: #0c0c0c; transition: 0.2s; cursor: pointer; }
        .song-card:active { background: #1f1f1f; transform: scale(0.98); }
        .song-card img { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; }
        .song-info { flex: 1; min-width: 0; }
        .song-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-artist { font-size: 13px; color: #888; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-duration { font-size: 12px; color: #555; font-weight: 600; }
        
        .player-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #121212; border-top: 1px solid #222; padding: 12px 20px 20px; display: flex; align-items: center; gap: 14px; z-index: 100; box-shadow: 0 -10px 25px rgba(0,0,0,0.8); }
        .player-bar.hidden { display: none; }
        .player-bar img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; }
        .player-info { flex: 1; min-width: 0; }
        .player-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-artist { font-size: 12px; color: #888; }
        .play-btn { width: 44px; height: 44px; border-radius: 50%; background: #3b82f6; border: none; color: #fff; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Fitube</h1>
    </div>

    <div class="search-container">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search songs, artists, albums...">
        </div>
    </div>

    <div class="content" id="results">
        <p style="text-align: center; color: #555; margin-top: 60px;">Search your favourite track to start playing</p>
    </div>

    <div class="player-bar hidden" id="playerBar">
        <img id="playerThumb" src="" alt="Album Art">
        <div class="player-info">
            <div class="player-title" id="playerTitle">-</div>
            <div class="player-artist" id="playerArtist">-</div>
        </div>
        <button class="play-btn" id="playBtn">⏸</button>
    </div>

    <audio id="audio" preload="auto"></audio>

    <script>
        const searchInput = document.getElementById('searchInput');
        const results = document.getElementById('results');
        const audio = document.getElementById('audio');
        const playerBar = document.getElementById('playerBar');
        const playerThumb = document.getElementById('playerThumb');
        const playerTitle = document.getElementById('playerTitle');
        const playerArtist = document.getElementById('playerArtist');
        const playBtn = document.getElementById('playBtn');

        let playCounter = 0;

        // AdMob Configuration
        const ADMOB_APP_ID = "ca-app-pub-9062126212417725~1316676975";
        const BANNER_AD_ID = "ca-app-pub-9062126212417725/8895889296";
        const INTERSTITIAL_AD_ID = "ca-app-pub-9062126212417725/7742484524";

        async function initAdMob() {
            if (window.Capacitor && window.Capacitor.Plugins.AdMob) {
                const { AdMob } = window.Capacitor.Plugins;
                await AdMob.initialize();
                await AdMob.showBanner({
                    adId: BANNER_AD_ID,
                    position: 'BOTTOM_CENTER',
                    margin: 0
                });
            }
        }

        async function triggerInterstitialAd() {
            if (window.Capacitor && window.Capacitor.Plugins.AdMob) {
                const { AdMob } = window.Capacitor.Plugins;
                await AdMob.prepareInterstitial({ adId: INTERSTITIAL_AD_ID });
                await AdMob.showInterstitial();
            }
        }

        let debounceTimer;
        searchInput.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            const query = searchInput.value.trim();
            if (query.length < 2) return;
            debounceTimer = setTimeout(() => searchMusic(query), 400);
        });

        async function searchMusic(q) {
            results.innerHTML = '<p style="text-align: center; color: #888; margin-top: 40px;">Searching audio tracks...</p>';
            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
                const songs = await res.json();
                
                if (!songs || songs.length === 0) {
                    results.innerHTML = '<p style="text-align: center; color: #666; margin-top: 40px;">No songs found.</p>';
                    return;
                }

                results.innerHTML = songs.map(s => `
                    <div class="song-card" onclick="playSong('${s.id}', '${escape(s.title)}', '${escape(s.artist)}', '${s.thumbnail}')">
                        <img src="${s.thumbnail}" alt="">
                        <div class="song-info">
                            <div class="song-title">${s.title}</div>
                            <div class="song-artist">${s.artist}</div>
                        </div>
                        <div class="song-duration">${s.duration || ''}</div>
                    </div>
                `).join('');
            } catch (e) {
                results.innerHTML = '<p style="text-align: center; color: #e11d48; margin-top: 40px;">Failed to load music.</p>';
            }
        }

        function playSong(id, title, artist, thumb) {
            playerThumb.src = thumb;
            playerTitle.innerText = unescape(title);
            playerArtist.innerText = unescape(artist);
            playerBar.classList.remove('hidden');

            audio.src = `/api/stream/${id}`;
            audio.play();
            playBtn.innerText = '⏸';

            playCounter++;
            // Har 3 songs play hone par Interstitial Ad show hoga
            if (playCounter % 3 === 0) {
                triggerInterstitialAd();
            }
        }

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playBtn.innerText = '⏸';
            } else {
                audio.pause();
                playBtn.innerText = '▶';
            }
        });

        document.addEventListener('DOMContentLoaded', initAdMob);
    </script>
</body>
</html>
