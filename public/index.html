<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitube Pro</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; }
        .header { padding: 20px; font-size: 24px; font-weight: bold; }
        .search-box { padding: 0 20px; }
        input { width: 100%; padding: 15px; border-radius: 25px; border: none; background: #222; color: #fff; }
        .results { padding: 20px; }
        .song-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #222; cursor: pointer; }
        .song-item img { width: 50px; border-radius: 5px; margin-right: 15px; }
        .player { position: fixed; bottom: 0; width: 100%; background: #111; padding: 15px; display: flex; align-items: center; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="header">Fitube</div>
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search songs...">
    </div>
    <div class="results" id="results"></div>
    <div class="player" id="player" style="display:none;">
        <span id="playingTitle">Playing...</span>
        <button onclick="togglePlay()" id="playBtn">Pause</button>
    </div>
    <audio id="audio"></audio>

    <script>
        const input = document.getElementById('searchInput');
        const results = document.getElementById('results');
        const audio = document.getElementById('audio');
        const player = document.getElementById('player');
        const playingTitle = document.getElementById('playingTitle');

        input.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const res = await fetch(`/api/search?q=${input.value}`);
                const data = await res.json();
                results.innerHTML = data.map(s => `
                    <div class="song-item" onclick="play('${s.id}', '${s.title.replace(/'/g, "")}')">
                        <img src="${s.thumbnail}">
                        <div>${s.title}</div>
                    </div>
                `).join('');
            }
        });

        function play(id, title) {
            audio.src = `/api/stream/${id}`;
            audio.play();
            player.style.display = 'flex';
            playingTitle.innerText = title;
        }

        function togglePlay() {
            audio.paused ? audio.play() : audio.pause();
        }
    </script>
</body>
</html>
